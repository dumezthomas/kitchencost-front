<mat-sidenav-container>

  <mat-sidenav mode="side" opened>

    <div class="logo">
      <img src="logo.png" alt="KitchenCost">
      <span>KitchenCost</span>
    </div>

    <mat-nav-list>

      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon fontSet="material-symbols-outlined">dashboard</mat-icon>
        <span>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/ingredients" routerLinkActive="active">
        <mat-icon fontSet="material-symbols-outlined">inventory_2</mat-icon>
        <span>Ingredients</span>
      </a>

      <a mat-list-item routerLink="/recipes" routerLinkActive="active">
        <mat-icon fontSet="material-symbols-outlined">menu_book</mat-icon>
        <span>Recipes</span>
      </a>

      <a mat-list-item routerLink="/menu-items" routerLinkActive="active">
        <mat-icon fontSet="material-symbols-outlined">restaurant_menu</mat-icon>
        <span>Menu Items</span>
      </a>

      <a mat-list-item routerLink="/settings" routerLinkActive="active">
        <mat-icon fontSet="material-symbols-outlined">settings</mat-icon>
        <span>Settings</span>
      </a>

    </mat-nav-list>

    <div class="logout">
      <button mat-button (click)="logout()">
        <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
        Logout
      </button>
    </div>

  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar>

      <span class="toolbar-title">{{ pageTitle() }}</span>

      <span class="spacer"></span>

      <div class="user-info">

        <span class="restaurant">
          {{ user()?.restaurantName }}
        </span>

        <span class="user">
          {{ user()?.username }}
        </span>

        <mat-chip>
          {{ user()?.role }}
        </mat-chip>

      </div>

    </mat-toolbar>

    <main class="content">
      <router-outlet/>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
